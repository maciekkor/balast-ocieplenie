<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kalkulator balastu i ocieplenia dla nurków. Dane zostają w telefonie.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balast">
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Balast i Ocieplenie</title>
<meta name="theme-color" content="#0E2227">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#E9EFEE; --surface:#FFFFFF; --sunk:#DDE6E5; --ink:#10262B; --muted:#56696D; --line:#C6D3D2;
  --accent:#D4521B; --accent-ink:#FFFFFF; --teal:#1B6A71; --teal-soft:#D5E7E7;
  --pos:#1B6A71; --neg:#8A5A2B; --good:#2E7D4F; --warn:#B7791F; --bad:#B3261E;
  --good-soft:#DCEFE3; --warn-soft:#F6EAD2; --bad-soft:#F6DAD7;
  --shadow:0 1px 2px rgba(16,38,43,.06),0 4px 16px rgba(16,38,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#07171B; --surface:#0E2227; --sunk:#0A1C20; --ink:#E1EDED; --muted:#8FA6A9; --line:#1F3A40;
    --accent:#F0773F; --accent-ink:#1A0B03; --teal:#5DB8BD; --teal-soft:#123338;
    --pos:#5DB8BD; --neg:#D39A5F; --good:#5CC28A; --warn:#E3B04F; --bad:#F07A6E;
    --good-soft:#12301F; --warn-soft:#33270F; --bad-soft:#3A1715;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#07171B; --surface:#0E2227; --sunk:#0A1C20; --ink:#E1EDED; --muted:#8FA6A9; --line:#1F3A40;
  --accent:#F0773F; --accent-ink:#1A0B03; --teal:#5DB8BD; --teal-soft:#123338;
  --pos:#5DB8BD; --neg:#D39A5F; --good:#5CC28A; --warn:#E3B04F; --bad:#F07A6E;
  --good-soft:#12301F; --warn-soft:#33270F; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
html{overflow-x:clip}
body{color:var(--ink);font:16px/1.45 var(--f-body);padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.app{max-width:600px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.pin{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 8px}
.top h1{font-size:clamp(16px,5vw,21px);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.toprow{display:flex;align-items:center;gap:8px;flex-shrink:0}
.langbtn{font:600 12px var(--f-mono);padding:4px 8px;border-radius:6px;letter-spacing:.05em}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:8;max-height:260px;overflow:auto}
.combo-list button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;font-weight:400}
.combo-list button:hover,.combo-list button.hl{background:var(--teal-soft)}
.combo-list b{color:var(--teal)}
.combo-list .none{padding:9px 10px;color:var(--muted);font-size:14px}
.datebox{position:relative;display:flex;gap:6px;max-width:260px}
.datebox input[type=text]{flex:1;min-width:0;padding-inline:8px;font-variant-numeric:tabular-nums}
.calbtn{flex-shrink:0;padding:0 8px;display:flex;align-items:center}
.calbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.datepick{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
.sb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.sb-lead{padding-right:10px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.sb-big{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-big small{font-size:20px;font-weight:600;margin-left:3px}
.sb-set{min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.sb-items{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb-therm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted)}
.sb-warn{font-size:12px;color:var(--bad);font-weight:600}
.top h1 span{color:var(--accent)}
.top .who{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:20px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.card h2 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* wynik */
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.result .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:700;font-size:84px;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font-size:32px;font-weight:600;margin-left:4px}
.range{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.scale{position:relative;height:28px;margin-top:14px;background:var(--sunk);border-radius:6px}
.scale .band{position:absolute;top:6px;bottom:6px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:4px}
.scale .pt{position:absolute;top:2px;bottom:2px;width:3px;background:var(--accent);border-radius:2px;transform:translateX(-1px)}
.scale .tick{position:absolute;bottom:-18px;font:11px var(--f-mono);color:var(--muted);transform:translateX(-50%)}
.note{margin-top:26px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
/* rozbicie */
.bars{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 52px;gap:6px 10px;align-items:center;font-size:14px}
.bars .nm{overflow-wrap:anywhere;line-height:1.2}
.bars .nm.l{color:var(--muted);font-style:italic}
.track{position:relative;height:12px}
.track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.track .b{position:absolute;top:1px;height:10px;border-radius:2px}
.track .b.p{left:50%;background:var(--pos)} .track .b.n{right:50%;background:var(--neg)}
.track .b.lr{opacity:.55}
.bars .v{text-align:right;font-family:var(--f-mono);font-size:13px}
.bars .sum{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* formularze */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input,select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{font:13px/1.4 var(--f-mono);min-height:120px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:600 15px var(--f-body);cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.sm{padding:5px 10px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* chipy */
.group{margin-top:10px}
.group:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:6px 12px;font:14px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:var(--sunk);font-weight:600;padding:9px 6px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--surface)}
.seg.lead button[data-v="light"][aria-pressed="true"]{background:var(--warn);color:#1a1200}
.seg.lead button[data-v="heavy"][aria-pressed="true"]{background:var(--neg);color:#fff}
.seg.therm button[data-v="cold"][aria-pressed="true"]{background:#2F6FB5;color:#fff}
.seg.therm button[data-v="cool"][aria-pressed="true"]{background:#6A9BC9;color:#fff}
.seg.therm button[data-v="warm"][aria-pressed="true"]{background:var(--warn);color:#1a1200}
/* pigułki */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-body);padding:3px 10px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--teal-soft);color:var(--teal)}
/* listy */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.li .r{text-align:right;flex-shrink:0}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.opt.best{border-color:var(--teal);background:var(--teal-soft)}
.opt .items{font-size:14px}
.opt .meta{font:13px var(--f-mono);color:var(--muted)}
.therm-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);text-align:right}
details summary{cursor:pointer;font-weight:600;color:var(--teal);padding-block:4px}
.banner{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center}
/* nawigacja */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:600 12px var(--f-body)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.editor{margin-top:10px;padding:12px;border:1px dashed var(--teal);border-radius:8px;background:var(--sunk)}
.editor input,.editor select{background:var(--surface)}
.search{display:flex;gap:8px}
@media (max-width:420px){ .big{font-size:72px} .grid3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <div id="summary"></div>
  </div>
  <main id="view"></main>
</div>

</nav>

// ===== Model obliczeniowy =====
const RHO_PB = 11.34, RHO_NEO = 0.38, AIR = 0.00123; // kg/l
const COV = {full:0.90, longjohn:0.65, shorty:0.55, overhood:0.60, vest:0.40, hood:0.06, gloves:0.025, boots:0.035};
const TORSO = {full:1, longjohn:0.75, shorty:0.85, overhood:0.85, vest:0.6, hood:0, gloves:0, boots:0};
const PLATE = {steel:-1.9, alu:-0.5, soft:0.5};
const BUILD = {slim:-3, athletic:-6, muscular:-10, average:0, fuller:3, obese:5};
const PRIOR_SD = {wetsuit:0.8, over:0.8, hood:0.3, gloves:0.2, boots:0.2, dry:1.0, under:1.2, bcd:0.5, wing:0.5, tank:0.4, fins:0.3};
const SD_BASE = 2.0, SD_NOISE = 0.7, HALF_LIFE = 30;
// doświadczenie: przesunięcie startowe korekty osobistej i jej niepewność
function totalDives(st){ return (+st.profile.divesBefore || 0) + st.dives.length; }
function expPrior(n){
  if (n < 25) return {mu: 1.0, sd: 2.5, label:'początkujący', key:'beg'};
  if (n < 100) return {mu: 0.5, sd: 2.0, label:'średnio zaawansowany', key:'mid'};
  if (n < 300) return {mu: 0.0, sd: 1.6, label:'doświadczony', key:'exp'};
  return {mu: -0.5, sd: 1.4, label:'bardzo doświadczony', key:'pro'};
}
const NEO_CATS = ['wetsuit','over','hood','gloves','boots'];

const compress = d => 0.6 * (1 - 1 / (1 + Math.max(0, d) / 10));
const bsa = pr => 0.007184 * Math.pow(pr.weight, 0.425) * Math.pow(pr.height, 0.725);
function bodyFat(pr){
  if (pr.bf != null && pr.bf !== '' && !isNaN(pr.bf)) return +pr.bf / 100;
  const bmi = pr.weight / Math.pow(pr.height / 100, 2);
  const bf = 1.2 * bmi + 0.23 * pr.age - 10.8 * (pr.sex === 'M' ? 1 : 0) - 5.4 + (BUILD[pr.build] || 0);
  return Math.min(0.5, Math.max(0.05, bf / 100));
}
function bodyBuoy(pr, rho){
  const bf = bodyFat(pr);
  const dens = 1 / (bf / 0.9007 + (1 - bf) / 1.100);
  const lungs = (pr.sex === 'M' ? 3.0 : 2.5) * pr.height / 175;
  return {tissue: pr.weight * (rho / dens - 1), lungs: lungs * rho, bf, dens};
}
function ageFactor(it, year){
  if (!it.year) return 1;
  const a = year - it.year;
  return a <= 0 ? 1 : a <= 3 ? 0.9 : 0.8;
}
function effT(p){ return p.tl != null ? (p.t + p.tl) / 2 : p.t; }

// wyporność pojedynczej sztuki sprzętu na głębokości d (kg, + unosi)
function itemBuoy(it, pr, ctx){
  const p = it.p, rho = ctx.rho;
  if (NEO_CATS.includes(it.cat) || (it.cat === 'dry' && p.shell === 'neo')){
    const cov = it.cat === 'dry' ? 0.95 : (COV[p.cover] || 0.5);
    const vol = bsa(pr) * cov * effT(p);             // litry
    const c = it.cat === 'dry' ? compress(ctx.depth) * 0.5 : compress(ctx.depth);
    const sole = it.cat === 'boots' && p.mass ? -0.00008 * p.mass : 0; // podeszwa gumowa
    return vol * (rho - RHO_NEO) * (1 - c) * ageFactor(it, ctx.year) + sole;
  }
  switch (it.cat){
    case 'dry': return p.b || 0;
    case 'under': return (p.g || 0) * bsa(pr) / 1.9;
    case 'bcd': return p.b || 0;
    case 'wing': return (p.b != null ? p.b : 0.3 + (PLATE[p.plate] ?? -0.5));
    case 'tank': return p.be + (p.vd || p.vol * 1.15) * (rho - 1.025) - p.vol * ctx.reserve * AIR;
    case 'misc': case 'fins': return p.b || 0;
  }
  return 0;
}

function physics(items, pr, ctx){
  const b = bodyBuoy(pr, ctx.rho);
  const comps = [
    {key:'tissue', label:'Ciało (tkanki)', v:b.tissue},
    {key:'lungs', label:'Płuca, pół oddechu', v:b.lungs}
  ];
  for (const it of items) comps.push({key:it.uid, label:itemName(it), v:itemBuoy(it, pr, ctx), cat:it.cat});
  return {comps, total: comps.reduce((s, c) => s + c.v, 0), body:b};
}
function itemName(it){ return it.brand === 'Ogólne' || it.brand === 'Własne' ? it.model : it.brand + ' ' + it.model; }
const toDry = (w, rho) => w / (1 - rho / RHO_PB);
const toWater = (d, rho) => d * (1 - rho / RHO_PB);
const roundUpHalf = x => Math.max(0, Math.ceil(x * 2 - 1e-9) / 2);

// ===== algebra =====
function invert(M){
  const n = M.length, A = M.map((r, i) => [...r, ...Array.from({length:n}, (_, j) => i === j ? 1 : 0)]);
  for (let c = 0; c < n; c++){
    let piv = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    [A[c], A[piv]] = [A[piv], A[c]];
    const d = A[c][c]; for (let k = 0; k < 2 * n; k++) A[c][k] /= d;
    for (let r = 0; r < n; r++) if (r !== c){ const f = A[r][c]; if (f) for (let k = 0; k < 2 * n; k++) A[r][k] -= f * A[c][k]; }
  }
  return A.map(r => r.slice(n));
}

function diveCtx(dv, st){
  const site = st.sites.find(s => s.id === dv.siteId) || {rho:1.025};
  return {rho: site.rho, depth: 5, reserve: dv.reserve ?? 50, year: +String(dv.date).slice(0, 4)};
}
function resolveItems(uids, st){ return uids.map(u => st.wardrobe.find(w => w.uid === u)).filter(Boolean); }

// ===== nauka balastu: regresja grzbietowa z priorytetami =====
function learnLead(st){
  const feats = st.wardrobe.filter(w => w.cat !== 'misc');
  const idx = {}; feats.forEach((w, i) => idx[w.uid] = i + 1);
  const n = feats.length + 1, EP = expPrior(totalDives(st));
  const prec = Array.from({length:n}, (_, i) => Array.from({length:n}, (_, j) => i === j ? 1 / Math.pow(i === 0 ? EP.sd : (PRIOR_SD[feats[i - 1].cat] || 0.8), 2) : 0));
  const xty = Array(n).fill(0);
  const dives = st.dives.filter(d => d.lead != null && d.lead !== '' && d.leadFb).sort((a, b) => a.date < b.date ? 1 : -1);
  const used = [];
  dives.forEach((dv, rank) => {
    const w = Math.pow(0.5, rank / HALF_LIFE) / (SD_NOISE * SD_NOISE);
    const ctx = diveCtx(dv, st), items = resolveItems(dv.items, st);
    const ideal = +dv.lead + (dv.leadFb === 'light' ? +dv.leadAdj : dv.leadFb === 'heavy' ? -dv.leadAdj : 0);
    const y = toWater(ideal, ctx.rho) - physics(items, st.profile, ctx).total - EP.mu;
    const x = Array(n).fill(0); x[0] = 1; items.forEach(it => { if (idx[it.uid]) x[idx[it.uid]] = 1; });
    for (let i = 0; i < n; i++){ if (!x[i]) continue; xty[i] += w * y; for (let j = 0; j < n; j++) if (x[j]) prec[i][j] += w; }
    used.push({id: dv.id, resid: y});
  });
  const cov = invert(prec);
  const theta = cov.map(r => r.reduce((s, v, j) => s + v * xty[j], 0));
  return {idx, theta, cov, n: dives.length, used, feats, exp: EP, total: totalDives(st)};
}

function predictLead(items, st, ctx, L){
  const ph = physics(items, st.profile, ctx);
  const x = Array(L.theta.length).fill(0); x[0] = 1;
  items.forEach(it => { if (L.idx[it.uid]) x[L.idx[it.uid]] = 1; });
  let corr = L.exp.mu, v = 0;
  for (let i = 0; i < x.length; i++){ if (!x[i]) continue; corr += L.theta[i]; for (let j = 0; j < x.length; j++) if (x[j]) v += L.cov[i][j]; }
  const learned = [{key:'exp', label:'Doświadczenie (' + L.total + ' nurk.)', v:L.exp.mu}, {key:'theta0', label:'Korekta osobista (nauka)', v:L.theta[0], learned:true}];
  items.forEach(it => { const k = L.idx[it.uid]; if (k && Math.abs(L.theta[k]) >= 0.05) learned.push({key:'th-' + it.uid, label:'Korekta: ' + itemName(it), v:L.theta[k], learned:true}); });
  const water = ph.total + corr;
  const sd = Math.sqrt(v + 0.25);
  return {comps: ph.comps, learned, water, sd, dry: toDry(water, ctx.rho),
    lo: toDry(water - 1.28 * sd, ctx.rho), hi: toDry(water + 1.28 * sd, ctx.rho),
    rec: roundUpHalf(toDry(water, ctx.rho)), body: ph.body};
}

// ===== ocieplenie =====
// dolna granica komfortu wg typowych tabel producentów/sklepów (3 mm: 22 °C, 5 mm: 17 °C, 7 mm: 10–12 °C, półsucha 8/7: 5–10 °C)
const COMFORT = [[1,26],[3,22],[5,17],[7,12],[9,9],[11,7]];
const REF_AVG_DEPTH = 7.5; // tabele opisują typowe nurkowanie rekreacyjne, więc kompresję liczymy względem niego
function comfortFromEq(eq){
  if (eq <= 1) return 26 + (1 - eq) * 2;
  if (eq >= 11) return 7 - (eq - 11);
  for (let i = 0; i < COMFORT.length - 1; i++){
    const [a, ta] = COMFORT[i], [b, tb] = COMFORT[i + 1];
    if (eq <= b) return ta + (eq - a) / (b - a) * (tb - ta);
  }
}
function thermalOfSet(items, maxDepth){
  const dry = items.find(i => i.cat === 'dry');
  if (dry){
    const u = items.find(i => i.cat === 'under');
    const base = dry.p.shell === 'neo' ? 14 : dry.p.shell === 'crushed' ? 15 : 20;
    const tc = u ? Math.min(u.p.tmin, base) : base;
    return {comfort: tc - (items.some(i => i.cat === 'gloves') ? 0.5 : 0), eq: null, kind:'dry'};
  }
  const c = compress(maxDepth / 2);
  let eq = 0, hood = false;
  for (const it of items){
    if (!['wetsuit','over','hood'].includes(it.cat)) continue;
    const p = it.p; if (p.hood || it.cat === 'hood') hood = true;
    eq += p.t * (TORSO[p.cover] ?? 0) * (p.semi ? 1.15 : 1);
  }
  if (eq === 0 && !hood) return {comfort: 31, eq: 0, kind:'none'};
  eq = eq * (1 - 0.5 * c) / (1 - 0.5 * compress(REF_AVG_DEPTH)) + (hood ? 1 : 0);
  return {comfort: comfortFromEq(eq), eq, kind:'wet'};
}
function tEf(plan, delta){
  const b = tBreak(plan); return b.t + delta;
}
// temperatura nurkowania: większość czasu spędzamy przy dnie, więc dno waży 75%, powierzchnia 25%;
// długie nurkowanie i kolejne nurkowania w ciągu dnia obniżają ją (wychłodzenie narasta)
const W_BOTTOM = 0.75;
function tBreak(plan){
  const base = W_BOTTOM * plan.tBottom + (1 - W_BOTTOM) * plan.tSurf;
  const long = Math.max(0, (plan.time - 45) / 15), rep = Math.max(1, plan.nDay || 1) - 1;
  return {base, long, rep, t: base - long - rep};
}
const BANDS = {cold:[-Infinity,-2], cool:[-2,0], ok:[0,Infinity], warm:[4,Infinity]};
function learnThermal(st){
  let s = 0, w = 0; const pts = [];
  st.dives.filter(d => d.thermal).forEach(dv => {
    const items = resolveItems(dv.items, st);
    const m0 = tEf(dv, 0) - thermalOfSet(items, dv.depth).comfort;
    const [lo, hi] = BANDS[dv.thermal];
    const target = Math.min(hi, Math.max(lo, m0 + (+st.profile.coldTol || 0)));
    const d = target - (m0 + (+st.profile.coldTol || 0));
    if (Math.abs(d) > 1e-9){ s += d; w += 1; }
    pts.push({id: dv.id, m0});
  });
  return {delta: s / (w + 1.5), n: w, pts};
}

if (typeof module !== 'undefined') module.exports = {bsa, bodyBuoy, bodyFat, itemBuoy, physics, learnLead, predictLead, thermalOfSet, tEf, learnThermal, toDry, roundUpHalf, compress};

let LANG = 'pl';
function tr(s, v){
  let o = LANG === 'en' && EN[s] != null ? EN[s] : s;
  if (v) o = o.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
  return o;
}
const lbl = () => LBL[LANG];
function frag(s){ if (LANG !== 'en' || !s) return s; let o = String(s); for (const [a, b] of FRAG_EN) o = o.split(a).join(b); return o; }

const fmt = (x, d = 1) => { const s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); return LANG === 'en' ? s : s.replace('.', ','); };
const sgn = (x, d = 1) => (x >= 0 ? '+' : '−') + fmt(Math.abs(x), d);
const num = v => v === '' || v == null ? null : +String(v).replace(',', '.');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const newId = p => p + '-' + Math.random().toString(36).slice(2, 8);

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
function validDate(s){ if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const d = new Date(s + 'T12:00:00'); return !isNaN(d) && d.toISOString().slice(0, 10) === s; }

function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seedState(); }
  catch(e){ S = seedState(); memOnly = true; }
  if (!S || S.v !== 1) S = seedState();
  if (S.profile.divesBefore == null) S.profile.divesBefore = Math.max(0, (+S.profile.dives || 0) - S.dives.length);
  S.wardrobe.forEach(w => { if (w.rental == null && /wypożycz/i.test(w.model)) w.rental = true; });
  S.wardrobe.forEach(w => { if (w.catId && /^misc-fins/.test(w.catId)) w.cat = 'fins'; });
  LANG = S.lang === 'en' ? 'en' : 'pl';
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); memOnly = false; } catch(e){ memOnly = true; } }
function learnState(){ return Object.assign({}, S, {dives: S.dives.filter(d => !S.learnSince || d.date >= S.learnSince)}); }
function recompute(){ const ls = learnState(); L = learnLead(ls); T = learnThermal(ls); }
function commit(){ save(); recompute(); render(); }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

  return s.name;
}

function toggleItem(list, uid){
  const it = S.wardrobe.find(w => w.uid === uid); if (!it) return list;
  if (list.includes(uid)) return list.filter(u => u !== uid);
  let out = list.slice();
  const drop = cats => { out = out.filter(u => { const w = S.wardrobe.find(x => x.uid === u); return w && !cats.includes(w.cat); }); };
  if (SINGLE[it.cat]) drop(SINGLE[it.cat]);
  if (it.cat === 'dry' || it.cat === 'under') drop(['wetsuit','over']);
  if (it.cat === 'wetsuit' || it.cat === 'over') drop(['dry','under']);
  out.push(uid); return out;
}
function setIssues(items){
  const iss = [];
  if (!items.some(i => i.cat === 'bcd' || i.cat === 'wing')) iss.push(tr('kamizelki lub skrzydła'));
  if (!items.some(i => i.cat === 'tank')) iss.push(tr('butli'));
  return iss;
}

function chipsFor(selected, act){
  const groups = CAT_ORDER.map(c => ({c, items: S.wardrobe.filter(w => w.cat === c)})).filter(g => g.items.length);
  if (!groups.length) return `<p class="muted small">${tr('Szafa jest pusta. Dodaj sprzęt w zakładce Szafa.')}</p>`;
  return groups.map(g => `<div class="group"><div class="label">${catLabel(g.c)}</div><div class="chips">${
    g.items.map(w => `<button class="chip" data-act="${act}" data-uid="${esc(w.uid)}" aria-pressed="${selected.includes(w.uid)}">${esc(nm(w))}${w.size ? ' · ' + esc(w.size) : ''}</button>`).join('')
  }</div></div>`).join('');
}
function siteMatches(q){
  const n = norm(q.trim());
  if (!n) return S.sites.slice();
  return S.sites.filter(s => { const name = norm(siteName(s)); return name.startsWith(n) || name.split(/[\s(),\-]+/).some(w => w.startsWith(n)); });
}
function hlName(name, q){
  const n = norm(q.trim()); if (!n) return esc(name);
  const nn = norm(name); let i = -1;
  for (let k = 0; k < nn.length; k++){ if ((k === 0 || /[\s(),\-]/.test(nn[k - 1])) && nn.startsWith(n, k)){ i = k; break; } }
  return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<b>' + esc(name.slice(i, i + n.length)) + '</b>' + esc(name.slice(i + n.length));

function barsHtml(pred){
  const rows = pred.comps.concat(pred.learned);
  const max = Math.max(1, ...rows.map(r => Math.abs(r.v)));
  const bar = r => { const w = Math.abs(r.v) / max * 50; return `<div class="track"><div class="b ${r.v >= 0 ? 'p' : 'n'}${r.learned ? ' lr' : ''}" style="width:${w.toFixed(1)}%"></div></div>`; };
  return `<div class="bars" role="table">${rows.map(r => { const lb = compLabel(r);
    return `<div class="nm${r.learned ? ' l' : ''}" role="cell" title="${esc(lb)}">${esc(lb)}</div>${bar(r)}<div class="v" role="cell">${sgn(r.v)}</div>`; }).join('')}

}
function scaleHtml(p){
  const a = Math.floor(Math.min(p.lo, p.rec) - 1), b = Math.ceil(Math.max(p.hi, p.rec) + 1), span = Math.max(1, b - a);
  const pos = x => ((x - a) / span * 100).toFixed(1) + '%';
  const step = span > 12 ? 4 : span > 6 ? 2 : 1, ticks = [];
  for (let t = Math.ceil(a / step) * step; t <= b; t += step) ticks.push(t);
  return `<div class="scale" aria-hidden="true"><div class="band" style="left:${pos(Math.max(a, p.lo))};width:calc(${pos(Math.min(b, p.hi))} - ${pos(Math.max(a, p.lo))})"></div><div class="pt" style="left:${pos(p.rec)}"></div>${ticks.map(t => `<span class="tick" style="left:${pos(t)}">${t}</span>`).join('')}</div>`;
}
function distribution(p, items){
  const kg = p.rec, wing = items.find(i => i.cat === 'wing'), dry = items.some(i => i.cat === 'dry');
  if (kg <= 0) return tr('Bez dodatkowego ołowiu.');
  const trim = (wing || dry) && kg >= 6 ? Math.min(2, Math.floor(kg / 6)) : 0;
  const main = kg - trim;
  let s = wing ? tr('Pas lub kieszenie na pasie uprzęży: {kg} kg', {kg: fmt(main)}) : tr('Kieszenie zrzutowe kamizelki / pas: {kg} kg', {kg: fmt(main)});
  if (trim) s += tr('; kieszenie trymujące na butli: {kg} kg (poprawia trym przy {x})', {kg: fmt(trim), x: tr(dry ? 'suchym skafandrze' : 'skrzydle')});
  return s + '.';
}
function thermalVerdict(m){
  return m >= 1 ? `<span class="pill good">${tr('Wystarczy')}</span>` : m >= 0 ? `<span class="pill warn">${tr('Na granicy')}</span>` : `<span class="pill bad">${tr('Za zimno')}</span>`;
}
function advisor(pl, curItems){
  const base = curItems.filter(i => !EXPO.includes(i.cat));
  const own = S.wardrobe.filter(w => !w.rental), of = c => own.filter(w => w.cat === c);
  const W = of('wetsuit'), O = of('over'), H = of('hood'), D = of('dry'), U = of('under');
  const combos = [];
  for (const w of W) for (const o of [null, ...O]) for (const h of [null, ...H]){
    if (h && (o && o.p.hood || w.p.hood)) continue;
    combos.push([w, o, h].filter(Boolean));
  }
  for (const o of O) if (!W.length) combos.push([o]);
  for (const d of D) for (const u of [null, ...U]) combos.push([d, u].filter(Boolean));
  const delta = (+S.profile.coldTol || 0) + T.delta, tef = tEf(pl, delta), ctx = planCtx(pl);  // porównanie: tWater + delta vs komfort ⇔ tWater vs komfort − delta
  const res = combos.map(c => {
    const th = thermalOfSet(c, pl.depth), items = base.concat(c);
    return {c, th, m: tef - th.comfort, lead: predictLead(items, S, ctx, L).rec};
  });
  const ok = res.filter(r => r.m >= 1).sort((a, b) => b.th.comfort - a.th.comfort || a.lead - b.lead);
  const no = res.filter(r => r.m < 1).sort((a, b) => b.m - a.m);
  return {tef, list: ok.slice(0, 3).concat(ok.length ? [] : no.slice(0, 3)), anyOk: ok.length > 0};
}

function summaryHtml(){
  const pl = S.plan, items = resolveItems(pl.items, S), ctx = planCtx(pl), iss = setIssues(items);
  const p = predictLead(items, S, ctx, L), delta = (+S.profile.coldTol || 0) + T.delta, tef = tEf(pl, delta), th = thermalOfSet(items, pl.depth);
  const short = it => it.cat === 'tank' ? (it.p.mat === 'alu' ? 'Alu ' : tr('Stal') + ' ') + fmt(it.p.vol, it.p.vol % 1 ? 1 : 0) + ' l' : nm(it).replace(/ \((wypożyczon[ay]|własny|rented|own)\)/, '');
  const order = ['wetsuit','over','hood','dry','under','bcd','wing','tank','fins'];
  const shown = items.filter(i => order.includes(i.cat)).sort((a, b) => order.indexOf(a.cat) - order.indexOf(b.cat));
  return `<div class="sb" role="status" aria-live="polite">
    <div class="sb-lead"><div class="label">${tr('Ołów')}</div><div class="sb-big">${fmt(p.rec)}<small>kg</small></div><div class="range">${fmt(Math.max(0, p.lo))}–${fmt(p.hi)}</div></div>
    <div class="sb-set"><div class="label">${tr('Zestaw')}</div>
      <div class="sb-items">${shown.map(i => esc(short(i))).join(' · ') || tr('Nic nie wybrano')}</div>
      <div class="sb-therm"><span>${tr('woda')} <b class="mono">${fmt(tBreak(pl).t)}°</b> · ${tr('komfort od')} <b class="mono">${fmt(th.comfort - delta)}°</b></span>${thermalVerdict(tef - th.comfort)}</div>
      ${iss.length ? `<div class="sb-warn">${tr('Brak')} ${iss.join(tr(' i '))}</div>` : ''}</div></div>`;
}
function render(){
  const ae = document.activeElement, fid = ae && ae.id && view.contains(ae) ? ae.id : null;
  let sel = null; try { sel = fid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null; } catch(_){}
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = tr(e.dataset.t));
  $('#lang').textContent = LANG === 'pl' ? 'EN' : 'PL';
  $('#lang').setAttribute('aria-label', LANG === 'pl' ? 'Switch to English' : 'Przełącz na polski');
  $('#summary').innerHTML = tab === 'calc' ? summaryHtml() : '';
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#who').innerHTML = `<span class="mono">${L.total}</span> ${tr('nurk.')}`; $('#who').title = S.profile.name || '';
  const f = {calc:viewCalc, log:viewLog, gear:viewGear, sites:viewSites, profile:viewProfile}[tab];
  view.innerHTML = f();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({preventScroll:true}); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch(_){} } }
}

const view = document.getElementById('view');
function draftFromPlan(){
  const p = predictLead(resolveItems(S.plan.items, S), S, planCtx(S.plan), L);
  return Object.assign(JSON.parse(JSON.stringify(S.plan)), {id: newId('d'), lead: p.rec, leadFb: null, leadAdj: 1, thermal: null, note: '', date: S.plan.date || today()});
}
function setLang(l){ LANG = l; S.lang = l; save(); render(); }
$('#lang').addEventListener('click', () => setLang(LANG === 'pl' ? 'en' : 'pl'));
document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; ui.editGear = ui.editSite = ui.quick = ui.siteQ = null; ui.confirmWipe = false; render(); window.scrollTo(0, 0);

function pickSite(pre, id){
  const tg = targetOf(pre); tg.siteId = id; fillTemps(tg); ui.siteQ = null;
  const el = document.getElementById(pre + 'site'); if (el) el.blur();
  return tg === S.plan ? commit() : render();
}
view.addEventListener('mousedown', e => { const b = e.target.closest('[data-act="site-pick"]'); if (b){ e.preventDefault(); pickSite(b.dataset.pre, b.dataset.id); } });
view.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const a = b.dataset.act;
  if (a === 'site-pick') return pickSite(b.dataset.pre, b.dataset.id);
  if (a === 'cal'){ const pk = document.getElementById(b.dataset.pre + 'datepick'); try { pk.showPicker(); } catch(_){ pk.focus(); pk.click(); } return; }
  if (a === 'plan-toggle'){ S.plan.items = toggleItem(S.plan.items, b.dataset.uid); return commit(); }
  if (a === 'draft-toggle'){ ui.draft.items = toggleItem(ui.draft.items, b.dataset.uid); return render(); }
  if (a === 'use-combo'){ const base = S.plan.items.filter(u => { const w = S.wardrobe.find(x => x.uid === u); return w && !EXPO.includes(w.cat); }); S.plan.items = base.concat(b.dataset.uids.split(',')); toast(tr('Zestaw podmieniony')); return commit(); }
  if (a === 'log-from-plan'){ ui.draft = draftFromPlan(); tab = 'log'; render(); return window.scrollTo(0, 0); }
  if (a === 'new-dive'){ ui.draft = draftFromPlan(); return render(); }
  if (a === 'edit-dive'){ ui.draft = JSON.parse(JSON.stringify(S.dives.find(d => d.id === b.dataset.id))); render(); return window.scrollTo(0, 0); }
  if (a === 'seg'){ ui.draft[b.dataset.name] = ui.draft[b.dataset.name] === b.dataset.v ? null : b.dataset.v; return render(); }
  if (a === 'cancel-dive'){ ui.draft = null; return render(); }
  if (a === 'del-dive'){ S.dives = S.dives.filter(d => d.id !== ui.draft.id); ui.draft = null; toast(tr('Nurkowanie usunięte')); return commit(); }
  if (a === 'save-dive'){
    const d = ui.draft;
    if (!validDate(d.date)){ toast(tr('Data w formacie rrrr-mm-dd')); return; }
    if (d.leadFb && (d.lead == null || d.lead === '')){ toast(tr('Wpisz, ile ołowiu miałeś')); return; }
    const before = L.theta[0];
    S.dives = S.dives.filter(x => x.id !== d.id).concat([d]); ui.draft = null; save(); recompute(); render();
    return toast(d.leadFb ? tr('Zapisano. Korekta osobista: {a} → {b} kg', {a: sgn(before), b: sgn(L.theta[0])}) : tr('Zapisano'));
  }
  if (a === 'edit-gear'){ ui.editGear = ui.editGear === b.dataset.uid ? null : b.dataset.uid; return render(); }
  if (a === 'close-gear'){ ui.editGear = null; return commit(); }
  if (a === 'quick-open'){ ui.quick = ui.quick ? null : {q:'', cat:'', kind:'bought'}; ui.editGear = null; return render(); }
  if (a === 'quick-kind'){ ui.quick.kind = b.dataset.v; return render(); }
  if (a === 'quick-add'){ return quickItem(fromCat(b.dataset.id, {uid: newId(b.dataset.id)})); }
  if (a === 'quick-own'){ const cat = $('#qq-own').value; return quickItem({uid: newId('own'), catId: null, cat, brand: 'Własne', model: catOne(cat), size: '', year: null, p: JSON.parse(JSON.stringify(OWN_DEFAULTS[cat])), src: 'wpis własny'}); }
  if (a === 'del-gear'){ const u = b.dataset.uid; S.wardrobe = S.wardrobe.filter(w => w.uid !== u); S.plan.items = S.plan.items.filter(x => x !== u); ui.editGear = null; toast(tr('Usunięto z szafy')); return commit(); }
  if (a === 'add-cat'){ const w = fromCat(b.dataset.id, {uid: newId(b.dataset.id), year: new Date().getFullYear()}); S.wardrobe.push(w); ui.editGear = w.uid; toast(tr('Dodano — ustaw rozmiar')); return commit(); }
  if (a === 'add-custom'){
    const cat = $('#custom-cat').value;
    const w = {uid: newId('own'), catId: null, cat, brand: 'Własne', model: catOne(cat) + ' ' + tr('(własny)'), size: '', year: new Date().getFullYear(), p: JSON.parse(JSON.stringify(OWN_DEFAULTS[cat])), src: 'wpis własny'};
    S.wardrobe.push(w); ui.editGear = w.uid; return commit();
  }
  if (a === 'edit-site'){ ui.editSite = ui.editSite === b.dataset.id ? null : b.dataset.id; return render(); }
  if (a === 'close-site'){ ui.editSite = null; return commit(); }
  if (a === 'add-site'){ const s = {id: newId('site'), name: tr('Nowy akwen'), rho: 1.000, ts: [4,4,5,8,13,18,21,21,17,12,7,4], tb: [4,4,4,5,6,7,8,8,8,7,6,4]}; S.sites.push(s); ui.editSite = s.id; return commit(); }
  if (a === 'del-site'){ S.sites = S.sites.filter(s => s.id !== b.dataset.id); ui.editSite = null; return commit(); }
  if (a === 'reset-learn'){ S.learnSince = today(); toast(tr('Nauka zaczyna się od dziś')); return commit(); }
  if (a === 'unreset-learn'){ delete S.learnSince; return commit(); }
  if (a === 'copy'){ const t = $('#bk-out'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast(tr('Skopiowano')), () => { try { document.execCommand('copy'); toast(tr('Skopiowano')); } catch(_){ toast(tr('Zaznaczono — skopiuj ręcznie')); } }); return; }
  if (a === 'import'){ return importText($('#bk-in').value); }
  if (a === 'wipe'){ if (!ui.confirmWipe){ ui.confirmWipe = true; return render(); }
    ui.confirmWipe = false; S = {v:1, lang: LANG, profile:{name:'', sex:'M', age:40, height:178, weight:80, build:'average', bf:'', coldTol:0, divesBefore:0}, wardrobe:[fromCat('misc-reg')], sites: SITE_PRESETS.map(s => Object.assign({preset:true}, JSON.parse(JSON.stringify(s)))), dives:[], plan:{siteId:'redsea', date: today(), depth:18, time:50, tSurf:26, tBottom:25, nDay:1, reserve:50, items:['misc-reg-1']}};
    fillTemps(S.plan); tab = 'profile'; toast(tr('Wyczyszczono. Zacznij od profilu i szafy.')); return commit(); }
  if (a === 'seed'){ S = seedState(); S.lang = LANG; toast(tr('Wczytano przykład')); return commit(); }
});
function importText(txt){
  try { const o = JSON.parse(txt); if (o.v !== 1 || !o.profile || !o.wardrobe) throw 0; S = o; LANG = S.lang === 'en' ? 'en' : 'pl'; toast(tr('Wczytano kopię')); commit(); }
  catch(_){ toast(tr('To nie jest kopia z tej aplikacji — sprawdź, czy wkleiłeś całość')); }
}
view.addEventListener('focusin', e => {
  const t = e.target;
  if (t.dataset.act === 'siteq' && !(ui.siteQ && ui.siteQ.pre === t.dataset.pre)){ ui.siteQ = {pre: t.dataset.pre, q: ''}; ui.hl = 0; render(); }
});
view.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset.act === 'siteq') setTimeout(() => {
    const ae = document.activeElement;
    if (ui.siteQ && !(ae && ae.dataset && ae.dataset.act === 'siteq')){ ui.siteQ = null; render(); }
  }, 120);
});
view.addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset.act !== 'siteq' || !ui.siteQ) return;
  const list = siteMatches(ui.siteQ.q);
  if (e.key === 'ArrowDown'){ e.preventDefault(); ui.hl = Math.min(list.length - 1, ui.hl + 1); render(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); ui.hl = Math.max(0, ui.hl - 1); render(); }
  else if (e.key === 'Enter'){ e.preventDefault(); if (list[ui.hl]) pickSite(ui.siteQ.pre, list[ui.hl].id); }
  else if (e.key === 'Escape'){ ui.siteQ = null; render(); t.blur(); }
});
view.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'siteq'){ ui.siteQ = {pre: t.dataset.pre, q: t.value}; ui.hl = 0; return render(); }
  if (t.dataset.date){
    const d = t.value.replace(/\D/g, '').slice(0, 8);
    const f = d.length > 6 ? d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6) : d.length > 4 ? d.slice(0, 4) + '-' + d.slice(4) : d;
    if (f !== t.value){ t.value = f; try { t.setSelectionRange(f.length, f.length); } catch(_){} }
    return;
  }
  if (t.dataset.act === 'qq'){ ui.quick.q = t.value; return render(); }
  if (t.dataset.act === 'q'){ ui.addQ = t.value; return render(); }
});
view.addEventListener('change', e => {
  const t = e.target, v = t.value;
  if (t.id === 'bk-file' && t.files[0]){ t.files[0].text().then(importText); return; }
  if (t.dataset.act === 'lang-sel') return setLang(v);
  if (t.dataset.act === 'qc'){ ui.addCat = v; return render(); }
  if (t.dataset.act === 'qqc'){ ui.quick.cat = v; return render(); }
  if (t.dataset.act === 'siteq') return;
  if (t.dataset.pick){
    if (!v) return;
    const tg = targetOf(t.dataset.pick); tg.date = v; fillTemps(tg);
    return tg === S.plan ? commit() : render();
  }
  if (t.dataset.f){
    const tg = targetOf(t.id.startsWith('d-') ? 'd-' : 'p-'), k = t.dataset.f;
    if (k === 'date'){
      if (!validDate(v)){ toast(tr('Data w formacie rrrr-mm-dd')); return render(); }
      tg.date = v; fillTemps(tg);
    } else tg[k] = k === 'note' ? v : num(v);
    return tg === S.plan ? commit() : render();
  }
  if (t.dataset.pr){ const k = t.dataset.pr; S.profile[k] = ['name','sex','build'].includes(k) ? v : (k === 'bf' ? (v === '' ? '' : num(v)) : num(v)); return commit(); }
  if (t.dataset.w || t.dataset.p){
    const w = S.wardrobe.find(x => x.uid === ui.editGear); if (!w) return;
    if (t.dataset.w) w[t.dataset.w] = t.dataset.w === 'year' ? num(v) : t.dataset.w === 'rental' ? v === '1' : v;
    else { const k = t.dataset.p; w.p[k] = t.dataset.bool ? v === '1' : ['cover','shell','plate','mat'].includes(k) ? v : num(v); if (k === 'plate') delete w.p.b; }
    if (w.catId && !w.src.includes('zmienione')) w.src += '; zmienione przez Ciebie';
    return commit();
  }
  if (t.dataset.s){
    const s = S.sites.find(x => x.id === ui.editSite); if (!s) return;
    const k = t.dataset.s;
    if (k === 'name') s.name = v;
    else if (k === 'rho') s.rho = +v;
    else { const arr = v.split(/[;\s]+/).map(num).filter(x => x != null && !isNaN(x)); if (arr.length === 12) s[k] = arr; else { toast(tr('Podaj 12 wartości, sty→gru')); return render(); } }
    return commit();
  }
});

load(); recompute(); render();

</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
